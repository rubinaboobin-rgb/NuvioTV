name: Build Debug armeabi-v7a

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/debug-armeabi-v7a.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"

permissions:
  contents: read

jobs:
  build-debug-armeabi-v7a:
    runs-on: ubuntu-latest

    steps:
      - name: Manual checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          elif [ ! -f local.properties ]; then
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          elif [ ! -f local.dev.properties ]; then
            touch local.dev.properties
          fi

      - name: Setup keystore
        id: keystore
        env:
          NUVIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          NUVIO_RELEASE_KEY_ALIAS_SECRET: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD_SECRET: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          NUVIO_RELEASE_STORE_PASSWORD_SECRET: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
        run: |
          TMP_KEYSTORE_PATH="${RUNNER_TEMP}/keystore"
          mkdir -p "${TMP_KEYSTORE_PATH}"
          KEYSTORE_FILE="${TMP_KEYSTORE_PATH}/debug-release-signing.jks"

          KEY_ALIAS="${NUVIO_RELEASE_KEY_ALIAS_SECRET:-nuviotv}"
          KEY_PASSWORD="${NUVIO_RELEASE_KEY_PASSWORD_SECRET:-815787}"
          STORE_PASSWORD="${NUVIO_RELEASE_STORE_PASSWORD_SECRET:-815787}"

          echo "::add-mask::${KEY_PASSWORD}"
          echo "::add-mask::${STORE_PASSWORD}"

          if [ -n "${NUVIO_RELEASE_KEYSTORE_BASE64}" ]; then
            printf '%s' "${NUVIO_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            echo "Using keystore from secrets"
            echo "generated=false" >> "${GITHUB_OUTPUT}"
          else
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storepass "${STORE_PASSWORD}" \
              -keypass "${KEY_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Nuvio Debug, OU=CI, O=Nuvio, L=Unknown, ST=Unknown, C=US"
            echo "Generated fallback keystore for debug build"
            mkdir -p build-artifacts/fallback-keystore
            cp "${KEYSTORE_FILE}" build-artifacts/fallback-keystore/release_keystore.jks
            base64 -w 0 "${KEYSTORE_FILE}" > build-artifacts/fallback-keystore/release_keystore.base64.txt
            printf '%s\n' \
              "Fallback keystore generated by debug-armeabi-v7a workflow." \
              "" \
              "Alias: ${KEY_ALIAS}" \
              "Key password: ${KEY_PASSWORD}" \
              "Store password: ${STORE_PASSWORD}" \
              "" \
              "To reuse this keystore in GitHub Actions:" \
              "1. Save release_keystore.base64.txt contents as secret NUVIO_RELEASE_KEYSTORE_BASE64" \
              "2. Save alias as NUVIO_RELEASE_KEY_ALIAS" \
              "3. Save key password as NUVIO_RELEASE_KEY_PASSWORD" \
              "4. Save store password as NUVIO_RELEASE_STORE_PASSWORD" \
              > build-artifacts/fallback-keystore/README.txt
            echo "generated=true" >> "${GITHUB_OUTPUT}"
          fi

          {
            echo "NUVIO_RELEASE_STORE_FILE=${KEYSTORE_FILE}"
            echo "NUVIO_RELEASE_KEY_ALIAS=${KEY_ALIAS}"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${KEY_PASSWORD}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${STORE_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build fullDebug armeabi-v7a APK
        run: ./gradlew :app:assembleFullDebug

      - name: Collect armeabi-v7a APK
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/full/debug -maxdepth 1 -type f -name "*armeabi-v7a*.apk" -exec cp {} build-artifacts/ \;
          ls -lah build-artifacts

      - name: Upload fallback keystore
        if: steps.keystore.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-armeabi-v7a-fallback-keystore
          path: build-artifacts/fallback-keystore/*
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-armeabi-v7a
          path: build-artifacts/*
          if-no-files-found: error
