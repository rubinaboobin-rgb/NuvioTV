name: Publish Play Store OTA beta armeabi-v7a

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New versionName, for example 0.7.17-beta"
        required: true
        type: string
      version_code:
        description: "Optional versionCode. Defaults to the current versionCode + 1."
        required: false
        type: string
      release_title:
        description: "Optional public GitHub Release title. Defaults to the version."
        required: false
        type: string
      custom_release_notes:
        description: "Optional full Markdown release notes."
        required: false
        type: string
      extra_notes:
        description: "Optional extra bullet lines, one per line."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: playstore-ota-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-playstore-ota-beta-armeabi-v7a:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare release signing config
        env:
          NUVIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          NUVIO_RELEASE_KEY_ALIAS_SECRET: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD_SECRET: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          NUVIO_RELEASE_STORE_PASSWORD_SECRET: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
        run: |
          missing=()
          [ -n "$NUVIO_RELEASE_KEYSTORE_BASE64" ] || missing+=("NUVIO_RELEASE_KEYSTORE_BASE64")
          [ -n "$NUVIO_RELEASE_KEY_ALIAS_SECRET" ] || missing+=("NUVIO_RELEASE_KEY_ALIAS")
          [ -n "$NUVIO_RELEASE_KEY_PASSWORD_SECRET" ] || missing+=("NUVIO_RELEASE_KEY_PASSWORD")
          [ -n "$NUVIO_RELEASE_STORE_PASSWORD_SECRET" ] || missing+=("NUVIO_RELEASE_STORE_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required signing secret: %s\n' "${missing[@]}"
            exit 1
          fi

          key_store="$RUNNER_TEMP/nuviotv-release.jks"
          printf '%s' "$NUVIO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_store"

          echo "::add-mask::$NUVIO_RELEASE_KEY_PASSWORD_SECRET"
          echo "::add-mask::$NUVIO_RELEASE_STORE_PASSWORD_SECRET"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$key_store"
            echo "NUVIO_RELEASE_KEY_ALIAS=$NUVIO_RELEASE_KEY_ALIAS_SECRET"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$NUVIO_RELEASE_KEY_PASSWORD_SECRET"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$NUVIO_RELEASE_STORE_PASSWORD_SECRET"
          } >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build and publish signed OTA beta APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(python3 scripts/release_beta.py "${{ inputs.version }}" --publish)
          args+=(--gradle-task ":app:assemblePlaystoreRelease")
          args+=(--apk-dir "app/build/outputs/apk/playstore/release")
          args+=(--asset-glob "*armeabi-v7a*.apk")

          if [ -n "${{ inputs.version_code }}" ]; then
            args+=(--version-code "${{ inputs.version_code }}")
          fi
          if [ -n "${{ inputs.release_title }}" ]; then
            args+=(--release-title "${{ inputs.release_title }}")
          fi
          if [ -n "${{ inputs.custom_release_notes }}" ]; then
            printf '%s\n' '${{ inputs.custom_release_notes }}' > "$RUNNER_TEMP/custom-release-notes.md"
            args+=(--custom-notes-file "$RUNNER_TEMP/custom-release-notes.md")
          fi
          if [ -n "${{ inputs.extra_notes }}" ]; then
            args+=(--extra-notes "${{ inputs.extra_notes }}")
          fi

          "${args[@]}"
